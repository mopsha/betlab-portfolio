# When each key was last rotated, for the 9:55 reminder (rotation.py, Mike's #83, Nov 2). Names and places only, never a value.
# Finishing the to-do it adds (More > Plan) counts as rotating, so this file needs no edit after that.
every_days: 180
keys:
  - {name: Odds API keys, where: "Railway worker: ODDS_API_KEY, ODDS_API_KEY_PAID; GitHub secret ODDS_API_KEY", rotated: 2026-10-23}
  - {name: CFBD key, where: "Railway worker: CFBD_API_KEY; GitHub secret CFBD_API_KEY", rotated: 2026-09-23}   # left as is Oct 23; never rotated
  - {name: Database password, where: "Supabase, then Railway SUPABASE_DB_URL", rotated: 2026-10-23}
  - {name: Apple push key, where: "Apple Developer, then Railway APNS_KEY_ID, APNS_KEY_P8", rotated: 2026-10-23}
  - {name: Web push keys, where: "Railway VAPID_PRIVATE_KEY, VAPID_PUBLIC_KEY", rotated: 2026-10-23}
  - {name: Novig read key, where: "Railway worker (scripts/novig_read_key.py)", rotated: 2026-10-23}
  - {name: GitHub token, where: "Railway worker: GITHUB_TOKEN", rotated: 2026-10-21}
  - {name: Anthropic key, where: "Railway web service: ANTHROPIC_API_KEY", rotated: 2026-10-24}
  - {name: Resend key, where: "Supabase Auth > SMTP Settings", rotated: 2026-11-02}
